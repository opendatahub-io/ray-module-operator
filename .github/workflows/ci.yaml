name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        run: make lint

      - name: Verify lint config
        run: make lint-config

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build manager binary
        run: make build

      - name: Build install manifest
        run: make build-installer

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: make test

  e2e:
    name: E2E Tests (Helm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: azure/setup-helm@v4

      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ray-module-operator-test-e2e

      - name: Run e2e tests
        run: make test-e2e

  e2e-kustomize:
    name: E2E Tests (Kustomize)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_INSTALL_METHOD: kustomize
      KIND_CLUSTER: ray-module-operator-test-e2e-kustomize
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ray-module-operator-test-e2e-kustomize

      - name: Run e2e tests
        run: make test-e2e

  verify-manifests:
    name: Verify Generated Files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate manifests and code
        run: |
          make manifests
          make generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'make manifests generate' and commit the result."
            git diff
            exit 1
          fi

  helm:
    name: Helm Chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint Helm chart
        run: make helm-lint

      - name: Verify synchronized Helm bundle
        run: make helm-chart-sync-check

      - name: Render Helm chart
        run: helm template ray charts/ray-module-operator > /tmp/ray-module-operator.yaml

      - name: Verify Helm values are applied
        run: |
          helm template ray charts/ray-module-operator \
            --set image.repository=example.invalid/ray-operator \
            --set image.tag=ci \
            --set replicaCount=2 \
            --set operatorNamespace=ray-ci \
            --set applicationsNamespace=apps-ci \
            --set relatedImages.kuberayOperator=example.invalid/kuberay:ci \
            --set relatedImages.kubeRbacProxy=example.invalid/proxy:ci \
            --set resources.limits.memory=1Gi \
            > /tmp/ray-module-operator-overrides.yaml
          grep -q 'image: example.invalid/ray-operator:ci' /tmp/ray-module-operator-overrides.yaml
          grep -q 'imagePullPolicy: IfNotPresent' /tmp/ray-module-operator-overrides.yaml
          grep -q 'replicas: 2' /tmp/ray-module-operator-overrides.yaml
          grep -q 'namespace: ray-ci' /tmp/ray-module-operator-overrides.yaml
          grep -q 'value: apps-ci' /tmp/ray-module-operator-overrides.yaml
          grep -q 'odh-kuberay-operator-controller-image: example.invalid/kuberay:ci' /tmp/ray-module-operator-overrides.yaml
          grep -q 'odh-kube-rbac-proxy-image: example.invalid/proxy:ci' /tmp/ray-module-operator-overrides.yaml
          grep -q 'memory: 1Gi' /tmp/ray-module-operator-overrides.yaml
          grep -q 'RELATED_IMAGE_ODH_KUBERAY_OPERATOR_CONTROLLER_IMAGE' /tmp/ray-module-operator-overrides.yaml
          grep -q 'RELATED_IMAGE_ODH_KUBE_RBAC_PROXY_IMAGE' /tmp/ray-module-operator-overrides.yaml
          grep -q 'name: run-as-ray-user' /tmp/ray-module-operator-overrides.yaml
          grep -q 'system:serviceaccount:apps-ci:kuberay-operator' /tmp/ray-module-operator-overrides.yaml
          grep -q 'namespace: ray-ci' /tmp/ray-module-operator-overrides.yaml
          if grep -q 'namespace: opendatahub' /tmp/ray-module-operator-overrides.yaml; then
            echo 'Found an unparameterized opendatahub namespace in the rendered chart'
            exit 1
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Docker image
        run: make docker-build
