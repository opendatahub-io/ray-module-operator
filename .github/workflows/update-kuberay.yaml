name: Update KubeRay

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - kuberay-downstream-update

jobs:
  validate:
    name: Validate update request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      base_branch: ${{ steps.context.outputs.base_branch }}
      source_sha: ${{ steps.context.outputs.source_sha }}
    steps:
      - name: Resolve update context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          DISPATCH_BASE_BRANCH: ${{ github.event.client_payload.base_branch }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          TRUSTED_DISPATCH_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            base_branch="$DISPATCH_BASE_BRANCH"
            source_sha="$DISPATCH_SOURCE_SHA"

            [[ -n "$base_branch" ]] || {
              echo "repository_dispatch payload is missing base_branch" >&2
              exit 1
            }
            [[ "$base_branch" == "$TRUSTED_DISPATCH_BRANCH" ]] || {
              echo "repository_dispatch is only allowed for the trusted default branch: $TRUSTED_DISPATCH_BRANCH" >&2
              exit 1
            }
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "repository_dispatch payload has an invalid source_sha" >&2
              exit 1
            }
          else
            expected_ref="refs/heads/$TRUSTED_DISPATCH_BRANCH"
            [[ "$WORKFLOW_REF" == "$expected_ref" ]] || {
              echo "Manual dispatch is only allowed from the trusted default branch: $TRUSTED_DISPATCH_BRANCH" >&2
              exit 1
            }
            base_branch="$WORKFLOW_REF_NAME"
            source_sha=""
          fi

          git check-ref-format --branch "$base_branch" >/dev/null || {
            echo "Invalid base_branch: $base_branch" >&2
            exit 1
          }

          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  update:
    needs: validate
    name: Refresh KubeRay manifests and fallbacks
    runs-on: ubuntu-24.04
    environment: manifests-sync
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: update-kuberay-${{ needs.validate.outputs.base_branch }}
      cancel-in-progress: true
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ needs.validate.outputs.base_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture starting KubeRay version
        id: previous
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^  kuberayOperator: .*:v([0-9]+(\.[0-9]+)*)$/\1/p' \
            charts/ray-module-operator/values.yaml | head -n 1)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Could not determine the starting KubeRay version from the checked-out branch." >&2
            exit 1
          }

          echo "Starting KubeRay version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve KubeRay commits
        id: resolve
        run: |
          set -euo pipefail

          odh_sha="$(git ls-remote https://github.com/opendatahub-io/kuberay.git refs/heads/dev | awk '{print $1}')"
          rhoai_sha="$(git ls-remote https://github.com/red-hat-data-services/kuberay.git refs/heads/main | awk '{print $1}')"

          [[ "$odh_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid ODH SHA: $odh_sha" >&2; exit 1; }
          [[ "$rhoai_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid RHOAI SHA: $rhoai_sha" >&2; exit 1; }

          echo "odh_sha=$odh_sha" >> "$GITHUB_OUTPUT"
          echo "rhoai_sha=$rhoai_sha" >> "$GITHUB_OUTPUT"

          sed -i "s#ref: dev@.*#ref: dev@$odh_sha#" hack/manifests-sources.yaml
          sed -i "s#ref: main@.*#ref: main@$rhoai_sha#" hack/manifests-sources.yaml
          sed -i "s#opendatahub-io:kuberay:dev@[^:]*:#opendatahub-io:kuberay:dev@$odh_sha:#" hack/scripts/get-manifests.sh
          sed -i "s#red-hat-data-services:kuberay:main@[^:]*:#red-hat-data-services:kuberay:main@$rhoai_sha:#" hack/scripts/get-manifests.sh

      - name: Refresh committed KubeRay snapshots
        run: make update-manifests

      - name: Update fallback images and version-sensitive tests
        run: |
          set -euo pipefail

          odh_version="$(sed -n 's/^    version: //p' opt/manifests/odh/kuberay/component_metadata.yaml | head -n 1)"
          rhoai_version="$(sed -n 's/^    version: //p' opt/manifests/rhoai/kuberay/component_metadata.yaml | head -n 1)"
          [[ -n "$odh_version" && "$odh_version" == "$rhoai_version" ]] || {
            echo "Snapshot versions differ or are missing: ODH=$odh_version RHOAI=$rhoai_version" >&2
            exit 1
          }

          image_version="$odh_version"
          image="quay.io/opendatahub/kuberay-operator:v$odh_version"
          export image image_version

          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          image = os.environ["image"]
          version = os.environ["image_version"]

          replacements = {
              "config/openshift/params.env": (
                  r"(odh-kuberay-operator-controller-image=)[^\n]+",
                  rf"\g<1>{image}",
              ),
              "internal/controller/testdata/manifests/kuberay/openshift/params.env": (
                  r"(odh-kuberay-operator-controller-image=)[^\n]+",
                  rf"\g<1>{image}",
              ),
              "charts/ray-module-operator/values.yaml": (
                  r"(  kuberayOperator: )[^\n]+",
                  rf"\g<1>{image}",
              ),
              "test/e2e/e2e_suite_test.go": (
                  r"(relatedImages\.kuberayOperator=)[^\"]+",
                  rf"\g<1>{image}",
              ),
          }

          for filename, (pattern, replacement) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              updated, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f"expected one replacement in {filename}, got {count}")
              path.write_text(updated)

          path = Path("internal/controller/configmap_test.go")
          text = path.read_text()
          text = re.sub(r"quay\.io/opendatahub/kuberay-operator:v[0-9.]+", image, text)
          text = re.sub(
              r'(image: "quay\.io/opendatahub/kuberay-operator:v[0-9.]+(?:@sha256:[^"]+)?", want: ")v[0-9.]+(")',
              rf"\g<1>v{version}\g<2>",
              text,
          )
          text, count = re.subn(
              r"want v[0-9.]+ from params\.env fallback",
              f"want v{version} from params.env fallback",
              text,
          )
          if count != 1:
              raise SystemExit(f"expected one fallback failure-message replacement, got {count}")

          text, count = re.subn(
              r'(func TestResolveKubeRayVersionDigestOnlyFallback\(.*?if got != ")v[0-9.]+(")',
              rf"\g<1>v{version}\g<2>",
              text,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one digest-only fallback assertion replacement, got {count}")
          path.write_text(text)

          path = Path("internal/controller/ray_controller_test.go")
          text = re.sub(
              r'Version\)\.To\(Equal\("v[0-9.]+"\)\)',
              f'Version).To(Equal("v{version}"))',
              path.read_text(),
          )
          path.write_text(text)
          PY

      - name: Verify no stale KubeRay fallback remains
        env:
          STARTING_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$STARTING_VERSION" == "$(sed -n 's/^    version: //p' opt/manifests/odh/kuberay/component_metadata.yaml | head -n 1)" ]]; then
            echo "KubeRay version did not change; no stale fallback check is needed."
            exit 0
          fi

          escaped_version="${STARTING_VERSION//./\\.}"
          if rg -n \
              "kuberay-operator:v${escaped_version}([^0-9.]|$)|kuberayOperator=.*v${escaped_version}([^0-9.]|$)|kuberayOperator: .*v${escaped_version}([^0-9.]|$)" \
              config charts test internal opt/manifests; then
            echo "Found a stale KubeRay v${STARTING_VERSION} fallback reference" >&2
            exit 1
          else
            scan_status=$?
            if [[ "$scan_status" -ne 1 ]]; then
              echo "Stale-reference scan failed with rg exit code $scan_status" >&2
              exit "$scan_status"
            fi
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.MANIFESTS_SYNC_APP_ID }}
          private-key: ${{ secrets.MANIFESTS_SYNC_APP_PRIVATE_KEY }}
          owner: opendatahub-io
          repositories: ray-module-operator
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/update-kuberay-${{ needs.validate.outputs.base_branch }}
          base: ${{ needs.validate.outputs.base_branch }}
          delete-branch: true
          commit-message: "chore: update KubeRay manifests and fallbacks"
          title: "chore: update KubeRay manifests and fallbacks"
          body: |
            Updates the pinned KubeRay manifest snapshots and synchronizes:

            - standalone Kustomize and Helm fallback images
            - E2E installation overrides
            - version-sensitive controller tests
            - manifest provenance SHAs

            The image tag is derived from the refreshed snapshot metadata.
            Triggering KubeRay commit: `${{ needs.validate.outputs.source_sha || 'manual dispatch' }}`
            Resolved ODH KubeRay snapshot: `${{ steps.resolve.outputs.odh_sha }}`
            Resolved RHOAI KubeRay snapshot: `${{ steps.resolve.outputs.rhoai_sha }}`
