                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: RaySpec defines the desired state of the Ray module.
              properties:
                applicationsNamespace:
                  description: |-
                    ApplicationsNamespace is the namespace where the module operator deploys
                    operand resources. Projected by the platform operator; immutable once set.
                  type: string
                managementState:
                  default: Managed
                  description: |-
                    ManagementState controls whether the operator actively manages the
                    component (Managed) or removes it (Removed).
                  enum:
                    - Managed
                    - Removed
                  type: string
              type: object
            status:
              description: RayStatus defines the observed state of the Ray module.
              properties:
                conditions:
                  items:
                    properties:
                      lastHeartbeatTime:
                        description: |-
                          The last time we got an update on a given condition, this should not be set and is
                          present only for backward compatibility reasons
                        format: date-time
                        type: string
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.
                          If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: message is a human-readable message indicating details about the transition.
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration
                          is 9, the condition is out of date with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          The value should be a CamelCase string.
                        type: string
                      severity:
                        description: |-
                          Severity with which to treat failures of this type of condition.
                          When this is not specified, it defaults to Error.
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-type: atomic
                distribution:
                  description: Distribution is the platform distribution context this module is aligned to.
                  properties:
                    name:
                      description: Name is the distribution name (e.g., SelfManagedRHOAI, OpenDataHub, Standalone).
                      type: string
                    version:
