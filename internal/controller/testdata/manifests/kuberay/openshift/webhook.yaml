apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ray-kuberay-validating
webhooks:
  - name: raycluster.ray.opendatahub.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: kuberay-webhook
        namespace: default
        path: /validate
    sideEffects: None
    failurePolicy: Ignore
