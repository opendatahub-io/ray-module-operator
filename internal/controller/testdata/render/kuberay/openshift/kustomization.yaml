apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opendatahub

configMapGenerator:
- name: ray-config
  envs:
    - params.env

configurations:
  - params.yaml

vars:
- name: namespace
  objref:
    kind: ConfigMap
    name: ray-config
    apiVersion: v1
  fieldref:
    fieldpath: data.namespace
- name: odh-kuberay-operator-controller-image
  objref:
    kind: ConfigMap
    name: ray-config
    apiVersion: v1
  fieldref:
    fieldpath: data.odh-kuberay-operator-controller-image

resources:
- deployment.yaml
- webhook.yaml
- certmanager.yaml
