- op: replace
  path: /metadata/annotations/prometheus.io~1port
  value: "8443"
- op: add
  path: /metadata/annotations/prometheus.io~1scheme
  value: https
- op: add
  path: /metadata/annotations/service.beta.openshift.io~1serving-cert-secret-name
  value: kuberay-operator-metrics-tls
- op: replace
  path: /spec/ports
  value:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
